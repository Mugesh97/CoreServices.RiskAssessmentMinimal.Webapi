pr: none
trigger:
  batch: false
  branches:
    include:
    - main
  paths:
    include:
    - Devops/Infrastructure/CloudFormation/*

variables:
  major: 1
  minor: 0
  patch: $[counter(format('{0}.{1}-{2}', variables['major'], variables['minor'], variables['Build.SourceBranchName']), 1)]
  ${{ if eq( variables['Build.SourceBranchName'], 'main' ) }}: 
    branch: ''
  ${{ if ne( variables['Build.SourceBranchName'], 'main' ) }}: 
    branch: -${{ variables['Build.SourceBranchName'] }}

name: $(major).$(minor).$(patch)$(branch)

pool:
  vmImage: ubuntu-latest

stages:
### Validate and publish CloudFormation templates
- template: ./Templates/Stages/stage-validate-publish-cloudformation.yml
  parameters:
    name: Validate_Publish
    displayName: Validate & Publish
    variables:
    - template: ../Variables/variables-global.yml

### Deploy Infrastructure PRD
- template: ./Templates/Stages/stage-deploy-infrastructure-aws.yml
  parameters:
    name: Deploy_Infrastructure
    displayName: Deploy Infrastructure
    dependsOn: Validate_Publish
    variables:
    - template: ../Variables/variables-global.yml
    environment: PRD