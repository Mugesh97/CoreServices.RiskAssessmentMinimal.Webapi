parameters:
- name: name
  displayName: Stage Name
  type: string

- name: displayName
  displayName: Stage Display Name
  type: string

- name: dependsOn
  displayName: Depends On
  type: object
  default: ''

- name: condition
  displayName: Condition
  type: string
  default: ''

- name: variables
  displayName: Variables
  type: object
  default: ''

- name: environment
  displayName: Environment
  type: string

stages:
- stage: ${{ parameters.name }}
  displayName: ${{ parameters.displayName }}
  ${{ if not(eq(parameters.dependsOn, '')) }}:
    dependsOn: ${{ parameters.dependsOn }}
  ${{ if not(eq(parameters.condition, '')) }}:
    condition: ${{ parameters.condition }}
  ${{ if not(eq(parameters.variables, '')) }}:
    variables: ${{ parameters.variables }}

  jobs:
  - deployment: Deploy_CloudFormation_Templates
    displayName: Deploy CloudFormation Templates
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          ### Update values in CloudFormation parameters file
          - task: replacetokens@5
            name: Update_CloudFormation_Parameters_File
            displayName: Update CloudFormation Parameters File
            inputs:
              targetFiles: $(Pipeline.Workspace)/cloudFormationTemplates/cf-template.parameters.json
              encoding: auto
              tokenPattern: default
              writeBOM: true
              escapeType: none
              verbosity: detailed
              actionOnMissing: warn
              keepToken: false
              actionOnNoFiles: warn
              enableTransforms: false
              enableRecursion: false
              useLegacyPattern: false
              enableTelemetry: false

          ### Upload CloudFormation files to AWS S3 bucket
          - task: S3Upload@1
            displayName: Upload files to S3
            inputs:
              awsCredentials: ${{ variables.awsCredentials }}
              regionName: ${{ variables.awsRegion }}
              SourceFolder: $(Pipeline.Workspace)/cloudFormationTemplates
              bucketName: deployment-${{ variables.awsStackName }}
              targetFolder: ${{ variables.awsStackName }}-$(major)-$(minor)-$(patch)-$(Build.SourceBranchName)
              createBucket: true

          ### Validate CloudFormation template
          - task: AWSCLI@1
            displayName: Validate CloudFormation Template
            inputs:
              awsCredentials: ${{ variables.awsCredentials }}
              regionName: ${{ variables.awsRegion }}
              awsCommand: cloudformation
              awsSubCommand: validate-template
              awsArguments: --template-url https://deployment-${{ variables.awsStackName }}.s3.eu-west-1.amazonaws.com/${{ variables.awsStackName }}-$(major)-$(minor)-$(patch)-$(Build.SourceBranchName)/cf-template.yml

          ### Deploy CloudFormation template
          - task: CloudFormationCreateOrUpdateStack@1
            displayName: Deploy CloudFormation Stack
            inputs:
              awsCredentials: ${{ variables.awsCredentials }}
              regionName: ${{ variables.awsRegion }}
              stackName: ${{ variables.awsStackName }}
              templateSource: s3
              s3BucketName: deployment-${{ variables.awsStackName }}
              s3ObjectKey: ${{ variables.awsStackName }}-$(major)-$(minor)-$(patch)-$(Build.SourceBranchName)/cf-template.yml
              templateParametersFile: $(Pipeline.Workspace)/cloudFormationTemplates/cf-template.parameters.json
              useChangeSet: true
              changeSetName: ${{ variables.awsStackName }}-$(major)-$(minor)-$(patch)-$(Build.SourceBranchName)

          ### Set pipeline run retention to 2 years if deploying to PRD
          - task: PowerShell@2
            displayName: Set Pipeline Run Retention
            condition: >-
              and(
                succeeded(),
                not(canceled()),
                eq('${{ parameters.environment }}', 'PRD')
              )
            inputs:
              targetType: 'inline'
              script: |
                $contentType = "application/json";
                $headers = @{ Authorization = 'Bearer $(System.AccessToken)' };
                $rawRequest = @{ daysValid = 365 * 2; definitionId = $(System.DefinitionId); ownerId = 'User:$(Build.RequestedForId)'; protectPipeline = $false; runId = $(Build.BuildId) };
                $request = ConvertTo-Json @($rawRequest);
                $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/build/retention/leases?api-version=6.0-preview.1";
                Invoke-RestMethod -uri $uri -method POST -Headers $headers -ContentType $contentType -Body $request;
              failOnStderr: true